[project]
name = "fluq-sdk"
version = "0.2.0"
description = "Python SDK for the Fluq agent observability platform"
requires-python = ">=3.11"
license = "MIT"
keywords = ["fluq", "agent", "observability", "tracing", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://fluq.ai"
Documentation = "https://docs.fluq.ai/sdk/python"
Repository = "https://github.com/fluq-ai/fluq-python"
Issues = "https://github.com/fluq-ai/fluq-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22"]
crewai = ["crewai>=0.60.0"]
langchain = ["langchain-core>=0.3.0"]
openai-agents = ["openai-agents>=0.1.0"]
all = ["crewai>=0.60.0", "langchain-core>=0.3.0", "openai-agents>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fluq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
